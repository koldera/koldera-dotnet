name: CI

on:
  pull_request:
    paths-ignore: [CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, ".github/ISSUE_TEMPLATE/**", .github/pull_request_template.md, .github/CODEOWNERS]
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, ".github/ISSUE_TEMPLATE/**", .github/pull_request_template.md, .github/CODEOWNERS]
  # release.yml runs this whole workflow for the tagged commit and publishes only when it passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: Actions minutes are limited, so everything shares one checkout, one restore and one build.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK comes from global.json: its version decides the implicit Microsoft.NET.ILLink.Tasks
          # reference recorded in packages.lock.json. 8.0.x adds the net8.0 runtime for the tests.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Source hygiene
        run: node scripts/check-source-hygiene.mjs
      - name: Tests of the repository scripts
        run: node --test scripts/check-source-hygiene.test.mjs scripts/check-licences.test.mjs

      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          # The gitleaks-action wrapper needs a paid licence for organisations; the plain binary does not.
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secrets in the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Secrets in the git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Vendored contracts equal sdk-contract-kit at contracts/KIT_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < contracts/KIT_VERSION)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::contracts/KIT_VERSION must hold a 40-character commit id"; exit 1; }
          kit="$RUNNER_TEMP/kit"
          expected="$RUNNER_TEMP/expected-contracts"
          mkdir -p "$kit" "$expected"

          # Public repositories can be read without a token; once sdk-contract-kit is public the check is mandatory.
          public=false
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' https://api.github.com/repos/koldera/sdk-contract-kit)" = "200" ]; then public=true; fi

          auth=()
          if ! $public; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          code="$(curl -sSL -o "$kit.tar.gz" -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/koldera/sdk-contract-kit/tarball/$sha")"
          if [ "$code" != "200" ]; then
            echo "fetching sdk-contract-kit at $sha returned HTTP $code"
            if $public; then
              echo "::error::sdk-contract-kit is public but $sha could not be fetched"
              exit 1
            fi
            echo "::notice title=Contract check skipped::sdk-contract-kit is private and not readable with this workflow token. The check is enforced once the repository is public."
            exit 0
          fi

          # contracts/ must be an exact mirror of the kit at that commit (scripts/sync-to-sdk.mjs in sdk-contract-kit).
          tar -xzf "$kit.tar.gz" -C "$kit" --strip-components=1
          cp -R "$kit/openapi.yaml" "$kit/document.schema.json" "$kit/problem.schema.json" "$kit/CORE_VERSION" "$kit/golden" "$expected/"
          printf '%s\n' "$sha" > "$expected/KIT_VERSION"
          if ! diff -ru "$expected" contracts; then
            echo "::error::contracts/ differs from sdk-contract-kit at $sha; re-run scripts/sync-to-sdk.mjs from the kit"
            exit 1
          fi

      # CI=true makes the restore locked: it fails when a packages.lock.json is out of date.
      - name: Restore (locked)
        run: dotnet restore
      - name: Build (warnings are errors; compiles the README and guide examples)
        run: dotnet build -c Release --no-restore
      - name: Test (net8.0 and net10.0)
        run: dotnet test -c Release --no-build
      - name: Licences of the restored NuGet packages
        run: node scripts/check-licences.mjs
      - name: Pack (with package validation)
        run: dotnet pack src/Koldera.Sdk -c Release --no-build -o artifacts
      - name: Package contents and a clean consumer build
        run: bash scripts/check-package.sh artifacts
