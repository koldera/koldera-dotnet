name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The full CI workflow for the tagged commit: nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag matches the version in the project file
        run: |
          version="${GITHUB_REF_NAME#v}"
          found="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Koldera.Sdk/Koldera.Sdk.csproj | head -n 1)"
          if [ "$found" != "$version" ]; then
            echo "::error::Koldera.Sdk.csproj has version $found but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  pack:
    needs: [ci, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - name: Pack (deterministic, Source Link, package validation)
        run: dotnet pack src/Koldera.Sdk -c Release --no-restore -p:ContinuousIntegrationBuild=true -o artifacts
      - name: Package contents and a clean consumer build
        run: bash scripts/check-package.sh artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*.*nupkg
          if-no-files-found: error

  # Publishing is the point of no return, so it is the last step that can fail a release.
  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: nuget # add required reviewers to this environment to approve each release
      url: https://www.nuget.org/packages/Koldera.Sdk
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC); there is no long-lived API key
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/
      # The temporary key lives for one hour, so it is requested right before the push.
      - name: NuGet login (OIDC to a short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }} # the nuget.org profile name, not an e-mail address
      - name: Push the package and the symbols (a version that is already on nuget.org is skipped)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" artifacts/*.nupkg artifacts/*.snupkg
          fi
